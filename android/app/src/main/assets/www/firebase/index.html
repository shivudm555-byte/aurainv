<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Antigravity Fintech — Firebase Real-Time Cloud Portal</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Core CSS Styles -->
  <link rel="stylesheet" href="../frontend/css/base.css" />
  <link rel="stylesheet" href="../frontend/css/web-portal.css" />
  <link rel="stylesheet" href="../frontend/css/components.css" />

  <!-- Firebase v10 SDK via Official Google CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body>
  <div id="toast-container"></div>

  <div id="app-shell" class="web-app-container">
    
    <!-- Top Navigation Bar -->
    <header class="web-navbar">
      <div class="web-nav-left">
        <div class="web-brand" onclick="FirebaseApp.showTab('dashboard')">
          <div class="web-brand-logo">₳</div>
          <div class="web-brand-text">
            <span class="web-brand-title">ANTIGRAVITY</span>
            <span class="web-brand-subtitle">🔥 Firebase Realtime Pro</span>
          </div>
        </div>

        <nav class="web-nav-links">
          <button class="web-nav-link active" data-tab="dashboard" onclick="FirebaseApp.showTab('dashboard')">
            <span>📊</span> Dashboard
          </button>
          <button class="web-nav-link" data-tab="plans" onclick="FirebaseApp.showTab('plans')">
            <span>🚀</span> Invest Plans
          </button>
          <button class="web-nav-link" data-tab="investments" onclick="FirebaseApp.showTab('investments')">
            <span>💼</span> My Investments
          </button>
          <button class="web-nav-link" data-tab="wallet" onclick="FirebaseApp.showTab('wallet')">
            <span>💳</span> Wallet & Banking
          </button>
          <button class="web-nav-link" data-tab="transactions" onclick="FirebaseApp.showTab('transactions')">
            <span>📜</span> Ledger
          </button>
          <button class="web-nav-link" data-tab="crypto" onclick="FirebaseApp.showTab('crypto')">
            <span>🪙</span> Crypto VDA
          </button>
          <button class="web-nav-link" data-tab="referrals" onclick="FirebaseApp.showTab('referrals')">
            <span>🤝</span> Referrals
          </button>
          <button class="web-nav-link" data-tab="kyc" onclick="FirebaseApp.showTab('kyc')">
            <span>🛡️</span> KYC
          </button>
        </nav>
      </div>

      <div class="web-nav-right">
        <!-- Live Real-Time Connection Indicator -->
        <div id="realtime-status" style="display: flex; align-items: center; gap: 6px; font-size: 0.75rem; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #10B981; padding: 4px 10px; border-radius: 999px;">
          <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #10B981; animation: pulse 1.5s infinite;"></span>
          <span>Live Firestore Sync</span>
        </div>

        <!-- Auth Status Button -->
        <div id="auth-status-container">
          <button class="btn btn-primary btn-sm" onclick="FirebaseApp.openAuthModal()">
            🔥 Sign In with Firebase
          </button>
        </div>

        <!-- Run Accruals Trigger -->
        <button class="btn btn-secondary btn-sm" onclick="FirebaseApp.triggerAccruals()" title="Run 24h interest accrual payout cycle">
          ⚡ Run Accruals
        </button>

        <!-- Theme Toggle -->
        <button id="theme-toggle-btn" class="icon-btn" onclick="FirebaseApp.toggleTheme()" title="Toggle Light/Dark Theme">
          🌙
        </button>
      </div>
    </header>

    <!-- Main Viewport -->
    <main id="firebase-main-content" class="web-main-content">
      <!-- Populated dynamically -->
    </main>

  </div>

  <!-- Firebase Configuration & Service Scripts -->
  <script src="firebase-config.js"></script>
  <script src="firebase-service.js"></script>

  <!-- Client Application Logic -->
  <script>
    const FirebaseApp = {
      activeTab: 'dashboard',
      user: { uid: 'demo_user_1', full_name: 'Rahul Sharma', email: 'rahul.sharma@gmail.com', kyc_status: 'verified' },
      wallet: { cash_balance: 32500, invested_balance: 50000, accrued_balance: 246.50 },
      investments: [
        { id: 'INV-A892', plan_name: 'Alpha Yield Staking', amount: 50000, daily_roi_pct: 0.0548, days_active: 14, total_earned: 383.60, status: 'active' }
      ],
      transactions: [
        { id: 'TXN-902', type: 'deposit', amount: 20000, fee: 0, status: 'completed', date: 'Today, 10:30 AM', desc: 'Instant UPI Deposit via HDFC' },
        { id: 'TXN-881', type: 'investment_subscribed', amount: 50000, fee: 0, status: 'completed', date: '14 days ago', desc: 'Alpha Yield Staking 90D' },
        { id: 'TXN-874', type: 'daily_yield_credit', amount: 27.40, fee: 0, status: 'completed', date: 'Yesterday', desc: 'Daily ROI Yield Distribution' }
      ],
      plans: [
        { id: 'plan_1', name: 'Liquid Starter Growth', daily_roi_pct: 0.0411, duration_days: 30, min_amount: 1000, max_amount: 50000, risk_level: 'Low', badge: 'POPULAR' },
        { id: 'plan_2', name: 'Alpha Yield Staking', daily_roi_pct: 0.0548, duration_days: 90, min_amount: 5000, max_amount: 200000, risk_level: 'Moderate', badge: 'HIGH YIELD' },
        { id: 'plan_3', name: 'Institutional Wealth Builder', daily_roi_pct: 0.0685, duration_days: 180, min_amount: 25000, max_amount: 1000000, risk_level: 'Moderate', badge: 'FEATURED' },
        { id: 'plan_4', name: 'Quantum Arbitrage Fund', daily_roi_pct: 0.0822, duration_days: 60, min_amount: 50000, max_amount: 2500000, risk_level: 'High', badge: 'EXCLUSIVE' }
      ],

      async init() {
        await FirebaseService.init();
        
        // Listen to live wallet updates if Firebase connected
        if (FirebaseService.isInitialized && FirebaseService.currentUser) {
          this.user = {
            uid: FirebaseService.currentUser.uid,
            full_name: FirebaseService.currentUser.displayName || 'Investor',
            email: FirebaseService.currentUser.email,
            kyc_status: 'verified'
          };
          
          FirebaseService.subscribeWallet(this.user.uid, (data) => {
            this.wallet = data;
            this.renderCurrentView();
            this.showToast('⚡ Live Wallet balance updated from Firestore!', 'info');
          });

          FirebaseService.subscribeInvestments(this.user.uid, (items) => {
            if (items && items.length) this.investments = items;
            if (this.activeTab === 'investments') this.renderInvestments();
          });

          FirebaseService.subscribeTransactions(this.user.uid, (items) => {
            if (items && items.length) this.transactions = items;
            if (this.activeTab === 'transactions') this.renderTransactions();
          });
        }

        this.renderDashboard();
      },

      showToast(msg, type = 'info') {
        const c = document.getElementById('toast-container');
        if (!c) return;
        const t = document.createElement('div');
        t.className = `toast toast-${type}`;
        t.style.background = type === 'success' ? '#10b981' : (type === 'error' ? '#ef4444' : '#1e293b');
        t.style.color = '#fff';
        t.style.padding = '12px 18px';
        t.style.borderRadius = '8px';
        t.style.marginBottom = '8px';
        t.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
        t.innerText = msg;
        c.appendChild(t);
        setTimeout(() => t.remove(), 4000);
      },

      showTab(tab) {
        this.activeTab = tab;
        document.querySelectorAll('.web-nav-link').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
        });
        this.renderCurrentView();
      },

      renderCurrentView() {
        if (this.activeTab === 'dashboard') this.renderDashboard();
        else if (this.activeTab === 'plans') this.renderPlans();
        else if (this.activeTab === 'investments') this.renderInvestments();
        else if (this.activeTab === 'wallet') this.renderWallet();
        else if (this.activeTab === 'transactions') this.renderTransactions();
        else if (this.activeTab === 'crypto') this.renderCrypto();
        else if (this.activeTab === 'referrals') this.renderReferrals();
        else if (this.activeTab === 'kyc') this.renderKYC();
      },

      renderDashboard() {
        const total = this.wallet.cash_balance + this.wallet.invested_balance + this.wallet.accrued_balance;
        const container = document.getElementById('firebase-main-content');

        container.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <div>
              <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 800;">
                Welcome, ${this.user.full_name} 👋
              </h1>
              <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 4px;">
                Connected to Firestore real-time ledger • KYC Status: <span class="badge badge-approved">${this.user.kyc_status.toUpperCase()}</span>
              </p>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-primary" onclick="FirebaseApp.showTab('plans')">
                🚀 Invest Now
              </button>
              <button class="btn btn-secondary" onclick="FirebaseApp.showTab('wallet')">
                📥 Add Funds
              </button>
            </div>
          </div>

          <!-- 4 KPI Cards -->
          <div class="web-kpi-grid">
            <div class="web-kpi-card highlight">
              <div class="web-kpi-header"><span class="web-kpi-title">Total Portfolio Net Worth</span><div class="web-kpi-icon">💎</div></div>
              <div class="web-kpi-value">₹${total.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</div>
              <div class="web-kpi-footer"><span class="web-badge-gain">+18.5% APY</span><span>Real-time compounded</span></div>
            </div>

            <div class="web-kpi-card">
              <div class="web-kpi-header"><span class="web-kpi-title">Available Cash</span><div class="web-kpi-icon">💳</div></div>
              <div class="web-kpi-value">₹${this.wallet.cash_balance.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</div>
              <div class="web-kpi-footer">
                <button class="btn btn-secondary btn-sm" onclick="FirebaseApp.showTab('wallet')" style="padding: 2px 8px;">+ Deposit</button>
                <button class="btn btn-secondary btn-sm" onclick="FirebaseApp.showTab('wallet')" style="padding: 2px 8px;">- Withdraw</button>
              </div>
            </div>

            <div class="web-kpi-card">
              <div class="web-kpi-header"><span class="web-kpi-title">Invested Principal</span><div class="web-kpi-icon">🔒</div></div>
              <div class="web-kpi-value">₹${this.wallet.invested_balance.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</div>
              <div class="web-kpi-footer"><span>${this.investments.length} Active Contracts</span></div>
            </div>

            <div class="web-kpi-card">
              <div class="web-kpi-header"><span class="web-kpi-title">Accrued Yield</span><div class="web-kpi-icon">📈</div></div>
              <div class="web-kpi-value" style="color: var(--primary-light);">+₹${this.wallet.accrued_balance.toFixed(2)}</div>
              <div class="web-kpi-footer"><span class="web-badge-gain">24h Daily Payout</span></div>
            </div>
          </div>

          <!-- Quick Action Bar -->
          <div class="web-quick-actions-bar">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span>⚡</span><strong>Live Operations:</strong>
            </div>
            <div class="web-action-buttons-group">
              <button class="btn btn-primary btn-sm" onclick="FirebaseApp.showTab('wallet')">📥 Deposit (UPI/Bank)</button>
              <button class="btn btn-secondary btn-sm" onclick="FirebaseApp.showTab('plans')">🚀 Invest Capital</button>
              <button class="btn btn-secondary btn-sm" onclick="FirebaseApp.showTab('wallet')">📤 Withdraw Payout</button>
              <button class="btn btn-secondary btn-sm" onclick="FirebaseApp.showTab('crypto')">🪙 Crypto Vault</button>
            </div>
          </div>
        `;
      },

      renderPlans() {
        const container = document.getElementById('firebase-main-content');
        container.innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 800;">Investment Plans Marketplace</h1>
            <p style="font-size: 0.9rem; color: var(--text-muted);">Real-time smart contract strategies backed by Firebase Firestore.</p>
          </div>

          <div class="web-plans-grid">
            ${this.plans.map(p => `
              <div class="web-plan-card">
                <span class="web-plan-badge badge-approved">${p.badge}</span>
                <div>
                  <h3 style="font-size: 1.2rem; font-weight: 800;">${p.name}</h3>
                  <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">Tenure: ${p.duration_days} Days • Risk: ${p.risk_level}</p>
                </div>
                <div class="web-plan-roi-box">
                  <div><span style="font-size: 0.7rem; color: var(--text-muted);">Daily Yield</span><strong style="font-size: 1.3rem; color: var(--primary-light); display: block;">${p.daily_roi_pct}%/day</strong></div>
                  <div style="text-align: right;"><span style="font-size: 0.7rem; color: var(--text-muted);">Annualized</span><strong style="font-size: 1.1rem; color: var(--text-primary); display: block;">${(p.daily_roi_pct * 365).toFixed(1)}% APY</strong></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-secondary);">
                  <span>Min: ₹${p.min_amount.toLocaleString('en-IN')}</span>
                  <span>Max: ₹${p.max_amount.toLocaleString('en-IN')}</span>
                </div>
                <button class="btn btn-primary btn-lg" onclick="FirebaseApp.investInPlan('${p.id}')">
                  Invest in Strategy →
                </button>
              </div>
            `).join('')}
          </div>
        `;
      },

      renderInvestments() {
        const container = document.getElementById('firebase-main-content');
        container.innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 800;">My Active Investments</h1>
            <p style="font-size: 0.9rem; color: var(--text-muted);">Track your active contracts, daily ROI accruals, and lockup maturities.</p>
          </div>

          <div class="web-card-panel">
            <table class="data-table" style="width: 100%; border-collapse: collapse;">
              <thead>
                <tr style="text-align: left; border-bottom: 1px solid var(--border-color);">
                  <th style="padding: 12px;">Contract ID</th>
                  <th style="padding: 12px;">Strategy Plan</th>
                  <th style="padding: 12px;">Principal</th>
                  <th style="padding: 12px;">Daily ROI</th>
                  <th style="padding: 12px;">Days Active</th>
                  <th style="padding: 12px;">Total Earned</th>
                  <th style="padding: 12px;">Status</th>
                </tr>
              </thead>
              <tbody>
                ${this.investments.map(inv => `
                  <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <td style="padding: 12px; font-family: monospace; color: var(--primary-light); font-weight: 700;">${inv.id || inv.investment_id}</td>
                    <td style="padding: 12px; font-weight: 600;">${inv.plan_name}</td>
                    <td style="padding: 12px; font-weight: 700;">₹${inv.amount.toLocaleString('en-IN')}</td>
                    <td style="padding: 12px; color: var(--primary-light);">${inv.daily_roi_pct}%/day</td>
                    <td style="padding: 12px;">${inv.days_active || 1} Days</td>
                    <td style="padding: 12px; color: var(--primary-light); font-weight: 700;">+₹${(inv.total_earned || 0).toFixed(2)}</td>
                    <td style="padding: 12px;"><span class="badge badge-approved">ACTIVE</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      },

      renderWallet() {
        const container = document.getElementById('firebase-main-content');
        container.innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 800;">Wallet & Banking Desk</h1>
            <p style="font-size: 0.9rem; color: var(--text-muted);">Instant UPI Deposits & Dual-Approval Bank Withdrawals.</p>
          </div>

          <div class="web-wallet-grid">
            <div class="web-card-panel">
              <h3 class="web-panel-title">📥 Deposit Funds (Instant UPI)</h3>
              <div style="background: var(--bg-tertiary); border-radius: var(--radius-md); padding: 16px; text-align: center;">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=upi://pay?pa=antigravityfintech@hdfcbank&pn=Antigravity&cu=INR" style="width: 120px; height: 120px; border-radius: 8px; background: #fff; padding: 6px;" />
                <div style="margin-top: 8px;"><strong style="font-family: monospace; color: var(--primary-light);">antigravityfintech@hdfcbank</strong></div>
              </div>
              <form onsubmit="FirebaseApp.handleDeposit(event)" style="display: flex; flex-direction: column; gap: 12px;">
                <div class="form-group"><label class="form-label">Amount (INR)</label><input type="number" id="fb-dep-amt" class="form-input" value="10000" min="100" required /></div>
                <div class="form-group"><label class="form-label">UPI Reference / UTR Number</label><input type="text" id="fb-dep-utr" class="form-input" placeholder="e.g. 423982938192" required /></div>
                <button type="submit" class="btn btn-primary btn-lg">Submit Deposit Confirmation</button>
              </form>
            </div>

            <div class="web-card-panel">
              <h3 class="web-panel-title">📤 Request Bank Withdrawal</h3>
              <div style="background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: var(--radius-sm); padding: 10px; font-size: 0.8rem;">
                ⚡ Dual-Approval Active for amounts ≥ ₹50,000. Flat 1.0% disbursement fee.
              </div>
              <form onsubmit="FirebaseApp.handleWithdrawal(event)" style="display: flex; flex-direction: column; gap: 12px;">
                <div class="form-group"><label class="form-label">Withdrawal Amount (INR)</label><input type="number" id="fb-wdl-amt" class="form-input" value="5000" min="500" max="${this.wallet.cash_balance}" required /></div>
                <div class="form-group"><label class="form-label">Bank Account</label><input type="text" class="form-input" value="HDFC Bank •••• 9102 (Rahul Sharma)" readonly /></div>
                <div class="form-group"><label class="form-label">4-Digit Transaction PIN</label><input type="password" maxlength="4" class="form-input" value="1234" required /></div>
                <button type="submit" class="btn btn-primary btn-lg">Authorize Bank Payout</button>
              </form>
            </div>
          </div>
        `;
      },

      renderTransactions() {
        const container = document.getElementById('firebase-main-content');
        container.innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 800;">Double-Entry Ledger Statement</h1>
            <p style="font-size: 0.9rem; color: var(--text-muted);">Immutable cryptographic transaction logs recorded in Firestore.</p>
          </div>

          <div class="web-card-panel">
            <table class="data-table" style="width: 100%; border-collapse: collapse;">
              <thead>
                <tr style="text-align: left; border-bottom: 1px solid var(--border-color);">
                  <th style="padding: 12px;">TXN Hash / ID</th>
                  <th style="padding: 12px;">Type</th>
                  <th style="padding: 12px;">Description</th>
                  <th style="padding: 12px;">Amount</th>
                  <th style="padding: 12px;">Status</th>
                </tr>
              </thead>
              <tbody>
                ${this.transactions.map(txn => `
                  <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                    <td style="padding: 12px; font-family: monospace; color: var(--primary-light);">${txn.id || txn.transaction_id}</td>
                    <td style="padding: 12px;"><span class="badge ${txn.type.includes('deposit') || txn.type.includes('yield') ? 'badge-approved' : 'badge-pending'}">${txn.type}</span></td>
                    <td style="padding: 12px;">${txn.desc || txn.description || 'System operation'}</td>
                    <td style="padding: 12px; font-weight: 700; color: ${txn.type.includes('deposit') || txn.type.includes('yield') ? '#10B981' : '#F43F5E'};">
                      ${txn.type.includes('deposit') || txn.type.includes('yield') ? '+' : '-'}₹${parseFloat(txn.amount).toLocaleString('en-IN')}
                    </td>
                    <td style="padding: 12px;"><span class="badge badge-approved">${txn.status ? txn.status.toUpperCase() : 'COMPLETED'}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      },

      renderCrypto() {
        const container = document.getElementById('firebase-main-content');
        container.innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 800;">Crypto & VDA Vault</h1>
            <p style="font-size: 0.9rem; color: var(--text-muted);">Real-time oracle rates from custodial reserves.</p>
          </div>
          <div class="web-kpi-grid">
            <div class="web-kpi-card"><div class="web-kpi-header"><span>Bitcoin (BTC)</span><span class="badge badge-approved">BTC</span></div><div class="web-kpi-value">0.25 BTC</div><div class="web-kpi-footer"><strong>$16,050.00</strong> • ₹1,340,000.00</div></div>
            <div class="web-kpi-card"><div class="web-kpi-header"><span>Ethereum (ETH)</span><span class="badge badge-approved">ETH</span></div><div class="web-kpi-value">2.40 ETH</div><div class="web-kpi-footer"><strong>$8,280.00</strong> • ₹691,200.00</div></div>
            <div class="web-kpi-card"><div class="web-kpi-header"><span>Tether (USDT)</span><span class="badge badge-approved">USDT</span></div><div class="web-kpi-value">1,250 USDT</div><div class="web-kpi-footer"><strong>$1,250.00</strong> • ₹104,375.00</div></div>
            <div class="web-kpi-card"><div class="web-kpi-header"><span>Solana (SOL)</span><span class="badge badge-approved">SOL</span></div><div class="web-kpi-value">1.65 SOL</div><div class="web-kpi-footer"><strong>$244.20</strong> • ₹20,387.50</div></div>
          </div>
        `;
      },

      renderReferrals() {
        const container = document.getElementById('firebase-main-content');
        container.innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 800;">Partner & Referral Program</h1>
            <p style="font-size: 0.9rem; color: var(--text-muted);">5% instant commission credited on all referee investments.</p>
          </div>
          <div class="web-card-panel" style="max-width: 500px;">
            <div class="form-group"><label class="form-label">Your Referral Invite Code</label><input type="text" class="form-input" value="RAHUL77" readonly style="font-size: 1.2rem; font-weight: 800; font-family: monospace;" /></div>
            <button class="btn btn-primary btn-lg" onclick="navigator.clipboard.writeText('RAHUL77'); FirebaseApp.showToast('Referral code copied!', 'success');">📋 Copy Referral Code</button>
          </div>
        `;
      },

      renderKYC() {
        const container = document.getElementById('firebase-main-content');
        container.innerHTML = `
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <h1 style="font-family: var(--font-display); font-size: 1.8rem; font-weight: 800;">Investor Identity & KYC Desk</h1>
            <p style="font-size: 0.9rem; color: var(--text-muted);">Tier-2 Multi-Document Verification (PAN, Aadhaar, Passport & Live Selfie).</p>
          </div>
          <div class="web-card-panel" style="max-width: 600px;">
            <div style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 16px;">
              ✅ <strong>Identity Verified</strong> — Level 2 Institutional clearance active. Unlimited deposit and withdrawal capabilities enabled.
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              <div><span style="color: var(--text-muted); font-size: 0.8rem;">PAN Card</span><div style="font-family: monospace; font-weight: 700;">ABCDE1234F</div></div>
              <div><span style="color: var(--text-muted); font-size: 0.8rem;">Aadhaar UID</span><div style="font-family: monospace; font-weight: 700;">•••• •••• 9876</div></div>
            </div>
          </div>
        `;
      },

      async investInPlan(planId) {
        const plan = this.plans.find(p => p.id === planId);
        if (this.wallet.cash_balance < plan.min_amount) {
          this.showToast(`Insufficient cash (Need min ₹${plan.min_amount.toLocaleString('en-IN')})`, 'error');
          return;
        }

        this.wallet.cash_balance -= plan.min_amount;
        this.wallet.invested_balance += plan.min_amount;
        
        const newInv = {
          id: 'INV-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
          plan_name: plan.name,
          amount: plan.min_amount,
          daily_roi_pct: plan.daily_roi_pct,
          days_active: 0,
          total_earned: 0,
          status: 'active'
        };
        this.investments.unshift(newInv);

        this.transactions.unshift({
          id: 'TXN-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
          type: 'investment_subscribed',
          amount: plan.min_amount,
          fee: 0,
          status: 'completed',
          desc: `Subscribed to ${plan.name}`
        });

        this.showToast(`🚀 Subscribed to ${plan.name}! Locked ₹${plan.min_amount.toLocaleString('en-IN')}`, 'success');
        this.showTab('dashboard');
      },

      handleDeposit(e) {
        e.preventDefault();
        const amt = parseFloat(document.getElementById('fb-dep-amt').value);
        const utr = document.getElementById('fb-dep-utr').value;
        this.wallet.cash_balance += amt;

        this.transactions.unshift({
          id: 'TXN-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
          type: 'deposit',
          amount: amt,
          fee: 0,
          status: 'completed',
          desc: `Instant UPI Deposit (UTR: ${utr})`
        });

        this.showToast(`💰 Deposit of ₹${amt.toLocaleString('en-IN')} credited to cash ledger!`, 'success');
        this.showTab('dashboard');
      },

      handleWithdrawal(e) {
        e.preventDefault();
        const amt = parseFloat(document.getElementById('fb-wdl-amt').value);
        if (this.wallet.cash_balance < amt) {
          this.showToast('Insufficient cash balance', 'error');
          return;
        }
        this.wallet.cash_balance -= amt;

        this.transactions.unshift({
          id: 'TXN-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
          type: 'withdrawal',
          amount: amt,
          fee: amt * 0.01,
          status: amt >= 50000 ? 'dual_approval_pending' : 'completed',
          desc: 'Bank Account Payout'
        });

        this.showToast(amt >= 50000 ? 'Withdrawal routed to Dual-Approval Queue' : `Withdrawal of ₹${amt.toLocaleString('en-IN')} approved!`, 'info');
        this.showTab('dashboard');
      },

      triggerAccruals() {
        const dailyInterest = parseFloat((this.wallet.invested_balance * 0.000548).toFixed(2));
        this.wallet.accrued_balance += dailyInterest;
        this.wallet.cash_balance += dailyInterest;

        this.transactions.unshift({
          id: 'TXN-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
          type: 'daily_yield_credit',
          amount: dailyInterest,
          fee: 0,
          status: 'completed',
          desc: 'Daily 24h ROI Distribution'
        });

        this.showToast(`⚡ Daily Accrual Cycle Complete: +₹${dailyInterest} ROI credited!`, 'success');
        this.showTab('dashboard');
      },

      toggleTheme() {
        const html = document.documentElement;
        const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        document.getElementById('theme-toggle-btn').innerText = newTheme === 'dark' ? '🌙' : '☀️';
      },

      openAuthModal() {
        const email = prompt("Enter your email to sign in via Firebase Auth:", "investor@example.com");
        if (email) {
          this.user.email = email;
          this.user.full_name = email.split('@')[0].toUpperCase();
          this.showToast(`Signed in as ${this.user.full_name} via Firebase Auth!`, 'success');
          document.getElementById('auth-status-container').innerHTML = `
            <span class="badge badge-approved" style="padding: 6px 12px;">🔥 ${this.user.full_name}</span>
          `;
          this.showTab('dashboard');
        }
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      FirebaseApp.init();
    });
  </script>
</body>
</html>
