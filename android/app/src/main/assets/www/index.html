<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AURA WEALTH — 2026 Fintech Investment Mobile App</title>
  
  <!-- Modern Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- PWA & Mobile App Metadata -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#070B14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AURA WEALTH" />
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/mobile-app.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/web-portal.css" />
  <link rel="stylesheet" href="css/admin-panel.css" />

  <style>
    /* Top Testbench Bar */
    .top-app-mode-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: rgba(10, 14, 26, 0.95);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      z-index: 1000;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-header-tag {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #00F0FF, #0066FF);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #070B14;
      font-size: 1.1rem;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    .brand-name-title {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: var(--text-primary);
    }

    .brand-edition-pill {
      font-size: 0.65rem;
      font-weight: 800;
      background: rgba(0, 240, 255, 0.15);
      color: #00F0FF;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .testbench-controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick-screen-select {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .quick-screen-select:focus {
      border-color: #00F0FF;
    }

    .device-switcher-btn-group {
      display: flex;
      background: var(--bg-card);
      padding: 2px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .device-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .device-btn.active {
      background: #00F0FF;
      color: #070B14;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <!-- Top Testbench Navigation Bar -->
  <header class="top-app-mode-bar">
    <div class="brand-header-tag">
      <div class="brand-logo-icon">▲</div>
      <div>
        <span class="brand-name-title">AURA WEALTH</span>
        <span class="brand-edition-pill">2026 MOBILE FINTECH PRO</span>
      </div>
    </div>

    <div class="testbench-controls-group">
      <!-- Device Frame Switcher -->
      <div class="device-switcher-btn-group">
        <button class="device-btn active" id="btn-device-iphone" onclick="App.setDeviceMode('iphone16')">
          📱 iPhone 16
        </button>
        <button class="device-btn" id="btn-device-pixel" onclick="App.setDeviceMode('pixel9')">
          📱 Pixel 9
        </button>
        <button class="device-btn" id="btn-device-full" onclick="App.setDeviceMode('full')">
          📲 Standalone App
        </button>
      </div>

      <!-- Quick Screen Jump (All 36 Screens) -->
      <select id="screen-jump-picker" class="quick-screen-select" onchange="Store.setMobileScreen(this.value)" title="Direct Screen Jump">
        <option value="" disabled selected>⚡ Jump to Screen (36)...</option>
        <optgroup label="1. Onboarding & Authentication">
          <option value="splash">1. Splash Screen</option>
          <option value="onboarding">2. 3-Slide Onboarding</option>
          <option value="login">3. Login (Email / OTP / 2FA)</option>
          <option value="signup">4. Registration Flow</option>
          <option value="otp">5. OTP Verification</option>
          <option value="forgot_password">6. Forgot Password</option>
        </optgroup>
        <optgroup label="2. KYC Compliance Flow">
          <option value="kyc">7. 5-Step KYC Verification Wizard</option>
          <option value="kyc_status">8. KYC Status Tracker</option>
        </optgroup>
        <optgroup label="3. Home & Dashboard">
          <option value="home">9. Home Dashboard (₹25,450.00)</option>
          <option value="portfolio_summary">10. Portfolio Summary</option>
          <option value="my_investments">11. Active Investments (Growth Plan)</option>
        </optgroup>
        <optgroup label="4. Investment & Catalog">
          <option value="invest_plans">12. Explore Investment Catalog</option>
          <option value="plan_details">13. Investment Plan Details</option>
          <option value="investment_details">14. Active Position Timeline</option>
          <option value="invest_process">15. 4-Step Investment Subscription</option>
        </optgroup>
        <optgroup label="5. Earnings & Accruals">
          <option value="earnings">16. Earnings Overview & Accruals</option>
        </optgroup>
        <optgroup label="6. Wallet, Banking & Payouts">
          <option value="wallet">17. Cash Wallet (₹5,450.00)</option>
          <option value="deposit">18. 4-Step Deposit Flow (UPI / Bank)</option>
          <option value="withdrawal">19. 5-Step Withdrawal (PIN & Dual Admin)</option>
        </optgroup>
        <optgroup label="7. Activity & History">
          <option value="activity">20. Activity & Transaction Center (7 Filters)</option>
          <option value="transaction_details">21. Transaction Receipt Details</option>
        </optgroup>
        <optgroup label="8. Digital Assets (Crypto)">
          <option value="crypto">22. Digital Assets (BTC / ETH / USDT / SOL)</option>
          <option value="crypto_wallet">23. VDA Wallet (QR Code & Send)</option>
        </optgroup>
        <optgroup label="9. Referrals, Notifications & Profile">
          <option value="referral">24. Invite & Earn (ALEX2026 Code)</option>
          <option value="notifications">25. Categorized Notification Center</option>
          <option value="profile">26. Investor Profile & KYC Badge</option>
          <option value="bank_accounts">27. Linked Bank Accounts</option>
        </optgroup>
        <optgroup label="10. Security & Biometrics">
          <option value="security">28. Security Dashboard (Strong 100%)</option>
          <option value="biometrics">29. Biometric FaceID / TouchID Scan</option>
        </optgroup>
        <optgroup label="11. Support & Settings">
          <option value="support">30. Help Center & Support Tickets</option>
          <option value="settings">31. App Settings (Theme & Currency)</option>
          <option value="terms">32. Terms & Conditions</option>
          <option value="privacy">33. Privacy Policy</option>
          <option value="risk">34. Risk Disclosures</option>
        </optgroup>
        <optgroup label="12. Error & Empty States">
          <option value="error_network">35. Network Error Screen</option>
          <option value="empty_investments">36. Empty State Screen</option>
        </optgroup>
      </select>

      <!-- User Identity Quick Picker -->
      <select id="global-user-picker" class="quick-screen-select" onchange="Store.switchDemoUser(this.value)" title="Switch Demo User">
        <option value="5" selected>👤 Alex Morgan (₹25,450 • Verified)</option>
        <option value="6">👤 Priya Patel (Pending KYC)</option>
        <option value="7">👤 Amit Verma (₹3.25L • HNW)</option>
        <option value="8">👤 Kavita Reddy (New User)</option>
      </select>

      <!-- Theme Switcher -->
      <button id="theme-toggle-btn" class="header-icon-btn" title="Toggle Dark/Light Mode" onclick="App.toggleTheme()">
        🌙
      </button>

      <!-- Haptics Audio Switcher -->
      <button id="haptics-toggle-btn" class="header-icon-btn" title="Toggle Haptic Audio" onclick="App.toggleHaptics()">
        🔊
      </button>

      <!-- Mode Switch: Mobile App vs Admin Panel -->
      <button id="view-mode-toggle-btn" class="btn btn-secondary btn-sm" onclick="App.toggleAdminMode()" style="font-weight: 700;">
        <span>🖥️</span> Admin Panel
      </button>
    </div>
  </header>

  <!-- ===================================================================
       VIEWPORT 1: 2026 FINTECH INVESTMENT MOBILE APPLICATION
       =================================================================== -->
  <div id="mobile-app-wrapper" class="mobile-view-wrapper">
    <div id="phone-device-frame" class="phone-simulator-frame device-iphone16">
      
      <!-- Dynamic Island / Punch Hole Notch -->
      <div class="phone-notch-area" id="device-notch">
        <div class="notch-camera"></div>
        <div class="notch-sensor"></div>
      </div>

      <!-- Phone Status Bar -->
      <div class="phone-status-bar">
        <span id="phone-clock">9:41</span>
        <div class="status-bar-icons">
          <span>5G</span>
          <span>📶</span>
          <span>🔋 98%</span>
        </div>
      </div>

      <!-- Mobile Screen Content Viewport -->
      <div class="mobile-screen-viewport">
        <div id="mobile-screen-content" class="screen-content-scroll">
          <!-- Dynamically populated by MobileRouter -->
        </div>

        <!-- Floating Action Button (FAB) -->
        <button id="mobile-fab-action-btn" class="mobile-fab-btn" title="Quick Actions">
          ⚡
        </button>

        <!-- Bottom Navigation Bar (5 Items) -->
        <nav id="mobile-bottom-nav" class="phone-bottom-nav">
          <button class="nav-tab-item active" data-screen="home">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
          </button>
          <button class="nav-tab-item" data-screen="invest">
            <span class="nav-icon">⚡</span>
            <span>Invest</span>
          </button>
          <button class="nav-tab-item" data-screen="wallet">
            <span class="nav-icon">💰</span>
            <span>Wallet</span>
          </button>
          <button class="nav-tab-item" data-screen="activity">
            <span class="nav-icon">📊</span>
            <span>Activity</span>
          </button>
          <button class="nav-tab-item" data-screen="profile">
            <span class="nav-icon">👤</span>
            <span>Profile</span>
          </button>
        </nav>

        <!-- Bottom Sheet Drawer Overlay -->
        <div id="mobile-sheet-overlay" class="mobile-sheet-overlay" onclick="MobileRouter.closeBottomSheet()"></div>
        <div id="mobile-bottom-sheet" class="mobile-bottom-sheet">
          <div class="sheet-header-bar">
            <h3 id="bottom-sheet-title">Quick Actions</h3>
            <button class="sheet-close-btn" onclick="MobileRouter.closeBottomSheet()">✕</button>
          </div>
          <div id="bottom-sheet-dynamic-content"></div>
        </div>

        <!-- Biometric Modal Overlay -->
        <div id="mobile-biometric-overlay" class="biometric-overlay-modal"></div>

        <!-- PIN Modal Overlay -->
        <div id="mobile-pin-overlay" class="pin-overlay-modal"></div>

        <!-- Home Indicator Bar -->
        <div class="phone-home-indicator"></div>
      </div>
    </div>
  </div>

  <!-- ===================================================================
       VIEWPORT 2: ADMIN CONTROL CENTER (Hidden by default, toggled via button)
       =================================================================== -->
  <section id="admin-app-wrapper" class="admin-layout-wrapper" style="display: none; min-height: 800px;">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <div class="admin-brand-title">
          <span style="color: #00F0FF;">⚡</span> AURA Admin
        </div>
        <div class="admin-role-badge-box">
          <span id="admin-current-role-tag" class="role-tag">Super Administrator</span>
        </div>
      </div>

      <nav class="admin-nav-menu">
        <div class="nav-section-heading">Overview</div>
        <button class="admin-nav-item active" data-tab="dashboard">
          <span>📊</span> Executive Dashboard
        </button>

        <div class="nav-section-heading">User & Compliance</div>
        <button class="admin-nav-item" data-tab="users">
          <span>👥</span> User Management
        </button>
        <button class="admin-nav-item" data-tab="kyc">
          <span>🪪</span> KYC Verification Desk
          <span class="badge-counter warning">1</span>
        </button>

        <div class="nav-section-heading">Investments & Earnings</div>
        <button class="admin-nav-item" data-tab="investments">
          <span>💼</span> Investment Plans
        </button>
        <button class="admin-nav-item" data-tab="earnings">
          <span>📈</span> Daily Accruals Engine
        </button>

        <div class="nav-section-heading">Banking & Liquidity</div>
        <button class="admin-nav-item" data-tab="deposits">
          <span>📥</span> Deposits Desk
        </button>
        <button class="admin-nav-item" data-tab="withdrawals">
          <span>📤</span> Dual-Approval Desk
          <span class="badge-counter">1</span>
        </button>
        <button class="admin-nav-item" data-tab="crypto">
          <span>🪙</span> Crypto & VDA Admin
        </button>

        <div class="nav-section-heading">Financial Ledger</div>
        <button class="admin-nav-item" data-tab="ledger">
          <span>📖</span> Double-Entry Ledger
        </button>
        <button class="admin-nav-item" data-tab="reports">
          <span>📋</span> Compliance Reports
        </button>

        <div class="nav-section-heading">Operations & Support</div>
        <button class="admin-nav-item" data-tab="tickets">
          <span>💬</span> Support Helpdesk
        </button>
        <button class="admin-nav-item" data-tab="audit">
          <span>🛡️</span> System Audit Logs
        </button>
      </nav>
    </aside>

    <div id="admin-content-viewport" class="admin-main-viewport">
      <!-- Dynamically populated by AdminNav -->
    </div>
  </section>

  <!-- Core JavaScript Libraries & Modules -->
  <script src="js/haptics.js"></script>
  <script src="js/chart_engine.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>

  <!-- Mobile Screen Controllers -->
  <script src="js/mobile/auth_flow.js"></script>
  <script src="js/mobile/kyc_flow.js"></script>
  <script src="js/mobile/dashboard.js"></script>
  <script src="js/mobile/investment.js"></script>
  <script src="js/mobile/earnings.js"></script>
  <script src="js/mobile/wallet.js"></script>
  <script src="js/mobile/activity.js"></script>
  <script src="js/mobile/crypto.js"></script>
  <script src="js/mobile/referral.js"></script>
  <script src="js/mobile/notifications.js"></script>
  <script src="js/mobile/profile.js"></script>
  <script src="js/mobile/security.js"></script>
  <script src="js/mobile/support.js"></script>
  <script src="js/mobile/settings.js"></script>
  <script src="js/mobile/error_empty.js"></script>
  <script src="js/mobile/router.js"></script>

  <!-- Admin JS Controllers -->
  <script src="js/admin/dashboard.js"></script>
  <script src="js/admin/user_mgmt.js"></script>
  <script src="js/admin/kyc_mgmt.js"></script>
  <script src="js/admin/invest_mgmt.js"></script>
  <script src="js/admin/earnings_mgmt.js"></script>
  <script src="js/admin/deposit_mgmt.js"></script>
  <script src="js/admin/withdraw_mgmt.js"></script>
  <script src="js/admin/crypto_mgmt.js"></script>
  <script src="js/admin/ledger_view.js"></script>
  <script src="js/admin/reports.js"></script>
  <script src="js/admin/tickets_mgmt.js"></script>
  <script src="js/admin/audit_logs.js"></script>
  <script src="js/admin/admin_nav.js"></script>

  <!-- App Bootstrapper -->
  <script src="js/app.js"></script>
</body>
</html>
