<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Antigravity Fintech — Modern Investment & Wealth Web Portal</title>
  
  <!-- Modern Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- PWA & Mobile App Metadata -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#10B981" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Antigravity" />
  <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=192&auto=format&fit=crop&q=80" />

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/web-portal.css" />
  <link rel="stylesheet" href="css/admin-panel.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div id="toast-container"></div>

  <div id="app-shell" class="web-app-container">
    
    <!-- ===================================================================
         DESKTOP WEB NAVBAR
         =================================================================== -->
    <header class="web-navbar">
      <div class="web-nav-left">
        <!-- Brand Logo -->
        <a href="javascript:void(0)" class="web-brand" onclick="WebPortal.setActiveTab('dashboard')">
          <div class="web-brand-logo">₳</div>
          <div class="web-brand-text">
            <span class="web-brand-title">ANTIGRAVITY</span>
            <span class="web-brand-subtitle">Fintech Pro</span>
          </div>
        </a>

        <!-- Main Navigation Links -->
        <nav class="web-nav-links" id="web-nav-links-menu">
          <button class="web-nav-link active" data-tab="dashboard">
            <span>📊</span> Dashboard
          </button>
          <button class="web-nav-link" data-tab="plans">
            <span>🚀</span> Invest Plans
          </button>
          <button class="web-nav-link" data-tab="wallet">
            <span>💳</span> Wallet & Banking
          </button>
          <button class="web-nav-link" data-tab="crypto">
            <span>🪙</span> Crypto VDA
          </button>
          <button class="web-nav-link" data-tab="referrals">
            <span>🤝</span> Referrals
          </button>
          <button class="web-nav-link" data-tab="profile">
            <span>👤</span> Profile & Security
          </button>
          <button class="web-nav-link" data-tab="support">
            <span>💬</span> Support
          </button>
        </nav>
      </div>

      <!-- Top Tools: User Picker, Admin Toggle, Download Zip, Theme -->
      <div class="web-nav-right">
        <!-- User Switcher -->
        <div class="user-quick-picker" title="Switch active customer identity">
          <span>👤 User:</span>
          <select id="global-user-picker">
            <option value="5" selected>Rahul Sharma (KYC Verified - ₹50k Port)</option>
            <option value="6">Priya Patel (KYC Pending - ₹25k Dep)</option>
            <option value="7">Amit Verma (HNW - Pending ₹80k Wdl)</option>
            <option value="8">Kavita Reddy (KYC Rejected)</option>
          </select>
        </div>

        <!-- Mode Toggle: Customer Portal vs Admin Control Center -->
        <button id="web-admin-toggle-btn" class="btn btn-secondary btn-sm" onclick="App.toggleAdminMode()" style="font-weight: 700;">
          <span>🖥️</span> Admin Panel
        </button>

        <!-- Download WordPress Plugin Button -->
        <a href="/download/antigravity-fintech.zip" download="antigravity-fintech.zip" class="btn btn-primary btn-sm" style="text-decoration: none; display: flex; align-items: center; gap: 6px; font-weight: 700; background: linear-gradient(135deg, #10b981, #059669); color: #fff;" title="Download Installable WordPress Plugin ZIP">
          <span>📥</span> Download WP Plugin (.zip)
        </a>

        <!-- Theme Toggle -->
        <button id="theme-toggle-btn" class="icon-btn" title="Toggle Light/Dark Theme">
          🌙
        </button>
      </div>
    </header>

    <!-- ===================================================================
         VIEWPORT: CUSTOMER WEB PORTAL
         =================================================================== -->
    <main id="web-content-viewport" class="web-main-content">
      <!-- Dynamically populated by WebPortal -->
    </main>

    <!-- ===================================================================
         VIEWPORT: ADMIN CONTROL CENTER (Hidden by default, toggled via button)
         =================================================================== -->
    <section id="admin-app-wrapper" class="admin-layout-wrapper" style="display: none; min-height: 800px;">
      <aside class="admin-sidebar">
        <div class="admin-sidebar-header">
          <div class="admin-brand-title">
            <span style="color: var(--primary);">⚡</span> Antigravity Admin
          </div>
          <div class="admin-role-badge-box">
            <span id="admin-current-role-tag" class="role-tag">Super Administrator</span>
          </div>
        </div>

        <nav class="admin-nav-menu">
          <div class="nav-section-heading">Overview</div>
          <button class="admin-nav-item active" data-tab="dashboard">
            <span>📊</span> Executive Dashboard
          </button>

          <div class="nav-section-heading">User & Compliance</div>
          <button class="admin-nav-item" data-tab="users">
            <span>👥</span> User Management
          </button>
          <button class="admin-nav-item" data-tab="kyc">
            <span>🪪</span> KYC Verification Desk
            <span class="badge-counter warning">1</span>
          </button>

          <div class="nav-section-heading">Investments & Earnings</div>
          <button class="admin-nav-item" data-tab="investments">
            <span>💼</span> Investment Plans
          </button>
          <button class="admin-nav-item" data-tab="earnings">
            <span>📈</span> Daily Accruals Engine
          </button>

          <div class="nav-section-heading">Banking & Liquidity</div>
          <button class="admin-nav-item" data-tab="deposits">
            <span>📥</span> Deposits Desk
          </button>
          <button class="admin-nav-item" data-tab="withdrawals">
            <span>📤</span> Dual-Approval Desk
            <span class="badge-counter">1</span>
          </button>
          <button class="admin-nav-item" data-tab="crypto">
            <span>🪙</span> Crypto & VDA Admin
          </button>

          <div class="nav-section-heading">Financial Ledger</div>
          <button class="admin-nav-item" data-tab="ledger">
            <span>📖</span> Double-Entry Ledger
          </button>
          <button class="admin-nav-item" data-tab="reports">
            <span>📋</span> Compliance Reports
          </button>

          <div class="nav-section-heading">Operations & Support</div>
          <button class="admin-nav-item" data-tab="tickets">
            <span>💬</span> Support Helpdesk
          </button>
          <button class="admin-nav-item" data-tab="audit">
            <span>🛡️</span> System Audit Logs
          </button>
          <button class="admin-nav-item" data-tab="settings">
            <span>⚙️</span> Platform Settings
          </button>
        </nav>
      </aside>

      <div id="admin-content-viewport" class="admin-main-viewport">
        <!-- Dynamically populated by AdminNav -->
      </div>
    </section>

  </div>

  <!-- Supabase JS Client & Auth -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase_auth.js"></script>

  <!-- JavaScript Modules -->
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  
  <!-- Web Portal JS Controllers -->
  <script src="js/web/web_portal.js"></script>

  <!-- Admin JS Controllers -->
  <script src="js/admin/dashboard.js"></script>
  <script src="js/admin/user_mgmt.js"></script>
  <script src="js/admin/kyc_mgmt.js"></script>
  <script src="js/admin/invest_mgmt.js"></script>
  <script src="js/admin/earnings_mgmt.js"></script>
  <script src="js/admin/deposit_mgmt.js"></script>
  <script src="js/admin/withdraw_mgmt.js"></script>
  <script src="js/admin/crypto_mgmt.js"></script>
  <script src="js/admin/ledger_view.js"></script>
  <script src="js/admin/reports.js"></script>
  <script src="js/admin/tickets_mgmt.js"></script>
  <script src="js/admin/audit_logs.js"></script>
  <script src="js/admin/admin_nav.js"></script>

  <!-- App Bootstrapper -->
  <script src="js/app.js"></script>
</body>
</html>
